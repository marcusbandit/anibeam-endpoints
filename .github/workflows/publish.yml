name: check and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pipx install check-jsonschema
      - name: Check definitions
        run: scripts/check.sh ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign the index
        env:
          SIGNING_KEY: ${{ secrets.ENDPOINTS_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          scripts/build-index.sh "$RUNNER_TEMP/key.pem"
          rm -f "$RUNNER_TEMP/key.pem"
          for f in index/*.json; do scripts/verify.sh "$f" >/dev/null; done
      - name: Commit the indexes whose endpoints changed
        run: |
          changed=()
          for f in index/*.json; do
            old=$(git show "HEAD:$f" 2>/dev/null | jq -r .payload | base64 -d | jq -c 'del(.serial)' || true)
            new=$(jq -r .payload "$f" | base64 -d | jq -c 'del(.serial)')
            [ "$old" = "$new" ] || changed+=("$f")
          done
          # Every index is re-signed on each run; only the ones whose content or key changed are
          # committed, along with any index whose group was removed.
          gone=$(git ls-files --deleted -- index)
          if [ ${#changed[@]} -eq 0 ] && [ -z "$gone" ]; then exit 0; fi
          git add -- "${changed[@]}" $gone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(index): rebuild and sign [skip ci]"
          git push
